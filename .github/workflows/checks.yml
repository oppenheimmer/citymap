name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_checks:
        description: Download browsers and run the full browser matrix
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data:codegen -- --check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run deploy:check -- --offline
      - uses: actions/upload-artifact@v7
        with:
          name: citymap-vercel
          path: dist
          retention-days: 14
  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_checks
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:local:browser
      - run: npm run build:test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}
          path: |
            test-results
            playwright-report
          retention-days: 7
