name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data:codegen -- --check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build:test
      - run: npm exec -- playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          PLAYWRIGHT_BROWSER: firefox
      - run: npm run test:browser
        env:
          PLAYWRIGHT_BROWSER: webkit
      - run: npm run build
      - run: npm run deploy:check -- --offline
      - uses: actions/upload-artifact@v7
        with:
          name: citymap-vercel
          path: dist
          retention-days: 14
